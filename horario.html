<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horario Semanal Cozy</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap");

    :root {
      --fondo: #f7efe3;
      --papel: #fffaf0;
      --papel-2: #fff3dc;
      --tinta: #4f4035;
      --suave: #9d806b;
      --verde: #9fbd8c;
      --verde-oscuro: #6f8f5f;
      --rosa: #e7b7a8;
      --amarillo: #f5d58b;
      --sombra: rgba(93, 68, 43, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.8), transparent 35%),
        linear-gradient(135deg, #f8ead7, #eef3df);
      color: var(--tinta);
    }

    .wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 15px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-family: "Kalam", cursive;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--verde-oscuro);
      margin: 0;
    }

    .calendar-card {
      width: 190px;
      background: var(--papel);
      border-radius: 22px;
      box-shadow: 0 10px 25px var(--sombra);
      transform: rotate(-1.5deg);
      overflow: hidden;
      margin: 20px auto;
    }

    .calendar-top {
      background: var(--verde);
      color: white;
      text-align: center;
      padding: 8px;
      font-weight: 800;
    }

    .calendar-days {
      font-family: "Kalam", cursive;
      font-size: 2rem;
      text-align: center;
      padding: 10px 5px;
    }

    .calendar-text {
      text-align: center;
      padding: 0 10px 10px;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .agenda {
      position: relative;
      background: var(--papel);
      border-radius: 34px;
      padding: 30px;
      box-shadow: 0 20px 50px var(--sombra);
      border: 2px solid white;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 15px;
    }

    .day-card {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      background: var(--papel);
      border-radius: 20px;
      padding: 15px;
      border: 1px solid rgba(111, 143, 95, 0.15);
      background:
        linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)),
        repeating-linear-gradient(to bottom, transparent 0, transparent 34px, rgba(159, 189, 140, 0.1) 35px);
    }

    .day-card.today {
      outline: 3px solid var(--amarillo);
      transform: translateY(-4px);
      background: #fffef0;
    }

    .day-title {
      font-family: "Kalam", cursive;
      font-size: 1.4rem;
      text-align: center;
      color: var(--verde-oscuro);
      margin-bottom: 10px;
      border-bottom: 1px dashed var(--verde);
    }

    .block {
      margin: 6px 0;
      padding: 8px;
      border-radius: 12px;
      border-left: 4px solid var(--verde);
      background: white;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.02);
    }

    .block-title {
      font-weight: 800;
      font-size: 0.85rem;
    }

    .block-time {
      font-family: "Kalam", cursive;
      font-size: 0.95rem;
      color: var(--suave);
    }

    .block.study { border-left-color: var(--verde); }
    .block.rest { border-left-color: var(--rosa); }
    .block.variable { border-left-color: var(--amarillo); }
    .block.nocturno { border-left-color: #8b7bb8; }

    .block.note {
      border-left-color: var(--amarillo);
      background: var(--papel-2);
      margin-top: auto;
    }

    .post-it-container {
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }

    .post-it {
      background: var(--papel-2);
      width: 100%;
      max-width: 500px;
      padding: 25px;
      position: relative;
      transform: rotate(1deg);
      box-shadow: 5px 5px 15px var(--sombra);
    }

    .post-it .pin {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
    }

    .post-it h3 {
      font-family: "Kalam", cursive;
      text-align: center;
      margin-top: 0;
    }

    .post-it ul {
      padding: 0;
      list-style: none;
      font-family: "Kalam", cursive;
    }

    .post-it li {
      padding: 5px 0;
      border-bottom: 1px dashed rgba(0,0,0,0.05);
    }

    .footer {
      text-align: center;
      margin-top: 30px;
    }

    .sticker {
      position: absolute;
      font-size: 2.2rem;
      z-index: 10;
    }

    .error-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 20px;
      background: #fff3dc;
      border-radius: 18px;
      border: 1px dashed var(--rosa);
      font-weight: 700;
    }

    @media (max-width: 1100px) {
      .week-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 650px) {
      .week-grid { grid-template-columns: 1fr; }
      .day-card { min-height: auto; }
    }
  </style>

.header h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(2rem,5vw,3rem);font-weight:700}
.agenda{border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 30px #65493714;background:var(--paper)}
.day-card,.calendar-card,.post-it{position:relative;isolation:isolate;overflow:hidden;border:1px solid var(--border);border-radius:14px;background:linear-gradient(125deg,var(--paper),var(--wash))}

</style>
</head>

<body>
  <main class="wrapper">
    <header class="header">
      <h1>📖 Horario Semanal</h1>
      <p>Estudio y descansos</p>

      <div class="calendar-card">
        <div class="calendar-top" id="weekMonth">CARGANDO...</div>
        <div class="calendar-days" id="weekDays">-- → --</div>
        <div class="calendar-text" id="weekText">Semana actual</div>
      </div>
    </header>

    <section class="agenda">
      <div class="sticker" style="top: -15px; left: 20px;">🌿</div>
      <div class="sticker" style="top: -15px; right: 20px;">☕</div>

      <div id="weekGrid" class="week-grid"></div>

      <div class="post-it-container">
        <div class="post-it">
          <span class="pin">📌</span>
          <h3>Notas de la semana</h3>
          <ul id="generalNotes"></ul>
        </div>
      </div>

      <div class="footer">
        <p>✨ Actualizado con mucho mimo ✨</p>
        <small id="lastUpdate">🗓️ cargando fecha real...</small>
      </div>
    </section>
  </main>

  <script>
    const CONFIG_FILE = "./config_horario.txt";
    const GITHUB_USER = "bibiopotoleando";
    const GITHUB_REPO = "horario";

    const displayNames = {
      LUNES: "Lunes",
      MARTES: "Martes",
      MIERCOLES: "Miércoles",
      JUEVES: "Jueves",
      VIERNES: "Viernes",
      SABADO: "Sábado",
      DOMINGO: "Domingo"
    };

    const icons = {
      estudio: "📚",
      descanso: "☕",
      variable: "✨",
      nocturno: "🌙"
    };

    async function loadAll() {
      try {
        const response = await fetch(CONFIG_FILE + "?v=" + Date.now());

        if (!response.ok) {
          throw new Error(`No se pudo cargar ${CONFIG_FILE}: ${response.status} ${response.statusText}`);
        }

        const text = await response.text();

        const cleanText = text.replace(/\uFEFF/g, "");

        const data = parseData(cleanText);

        renderUI(data);
        fetchGitHubDate();

      } catch (e) {
        console.error("Error al cargar datos:", e);

        document.getElementById("weekGrid").innerHTML = `
          <div class="error-box">
            ⚠️ Error de lectura: no se pudo cargar <strong>config_horario.txt</strong>.<br>
            Abre esta URL para comprobarlo:<br>
            <small>https://${GITHUB_USER}.github.io/${GITHUB_REPO}/config_horario.txt</small>
          </div>
        `;
      }
    }

    async function fetchGitHubDate() {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/commits?path=config_horario.txt&per_page=1`
        );

        if (!res.ok) throw new Error("No se pudo consultar GitHub API");

        const commits = await res.json();

        if (commits && commits.length > 0) {
          const date = new Date(commits[0].commit.committer.date);
          const options = { day: "numeric", month: "long", year: "numeric" };

          document.getElementById("lastUpdate").textContent =
            `🗓️ actualizado el ${date.toLocaleDateString("es-ES", options)}`;
        }
      } catch (err) {
        const now = new Date();

        document.getElementById("lastUpdate").textContent =
          `🗓️ actualizado el ${now.toLocaleDateString("es-ES")}`;
      }
    }

    function normalizeKey(text) {
      return text
        .toUpperCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function parseData(text) {
      const schedule = {};
      const generalNotes = [];

      let currentDay = null;
      let week = "";
      let isNotes = false;

      text.split(/\r?\n/).forEach(rawLine => {
        let line = rawLine.trim();

        if (!line || line.startsWith("#")) return;

        if (line.toUpperCase().includes("[NOTAS]")) {
          isNotes = true;
          currentDay = null;
          return;
        }

        if (isNotes) {
          if (line.startsWith("-")) line = line.substring(1).trim();
          if (line) generalNotes.push(line);
          return;
        }

        if (/^SEMANA:/i.test(line)) {
          week = line.split(/SEMANA:/i)[1].trim();
          return;
        }

        const dayMatch = line.match(/\[(LUNES|MARTES|MIERCOLES|MIÉRCOLES|JUEVES|VIERNES|SABADO|SÁBADO|DOMINGO)\]/i);

        if (dayMatch) {
          currentDay = normalizeKey(dayMatch[1]);
          schedule[currentDay] = { blocks: [], note: "" };
          return;
        }

        if (currentDay && line.includes(":")) {
          const partsLine = line.split(/:(.+)/);
          const key = partsLine[0].trim().toLowerCase();
          const val = (partsLine[1] || "").trim();

          if (key === "nota") {
            schedule[currentDay].note = val;
            return;
          }

          let time = val;
          let type = "variable";
          let label = val;
          let period = key;

          if (val.includes("|")) {
            const parts = val.split("|");
            time = parts[0].trim();

            const typeText = (parts[1] || "").trim().toLowerCase();

            if (typeText.includes("estudio")) {
              type = "estudio";
            } else if (typeText.includes("descanso")) {
              type = "descanso";
            }
          } else if (val.toLowerCase().includes("descanso")) {
            type = "descanso";
            time = "Descanso";
          }

          if (key === "nocturno") {
            if (type === "estudio") {
              label = "Estudio nocturno";
            } else if (type === "descanso") {
              label = "Descanso nocturno";
            } else {
              label = "Nocturno";
            }
          } else if (type === "estudio") {
            label = `Estudio de ${key}`;
          } else if (type === "descanso") {
            label = "Descanso";
          } else {
            label = key.charAt(0).toUpperCase() + key.slice(1);
          }

          schedule[currentDay].blocks.push({ time, type, label, period });
        }
      });

      return { week, schedule, generalNotes };
    }

    function renderUI(data) {
      const match = data.week.match(/(\d{2})\/(\d{2})\/(\d{4})/);

      if (match) {
        const months = [
          "ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO",
          "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"
        ];

        const startDay = parseInt(match[1], 10);
        const monthIndex = parseInt(match[2], 10) - 1;
        const year = match[3];

        document.getElementById("weekMonth").textContent = `${months[monthIndex]} ${year}`;
        document.getElementById("weekDays").textContent = `${String(startDay).padStart(2, "0")} → ${String(startDay + 6).padStart(2, "0")}`;
      }

      document.getElementById("weekText").textContent = "Semana del " + data.week;

      const grid = document.getElementById("weekGrid");
      const ordered = ["LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES", "SABADO", "DOMINGO"];

      const today = normalizeKey(
        new Date().toLocaleDateString("es-ES", { weekday: "long" })
      );

      grid.innerHTML = "";

      ordered.forEach(dayKey => {
        const dayData = data.schedule[dayKey] || { blocks: [], note: "" };

        const card = document.createElement("article");
        card.className = "day-card" + (dayKey === today ? " today" : "");

        let blocksHTML = dayData.blocks.map(block => {
          const icon = block.period === "nocturno" ? icons.nocturno : (icons[block.type] || "✨");

          return `
            <div class="block ${block.type} ${block.period}">
              <div class="block-title">${icon} ${block.label}</div>
              <div class="block-time">${block.time}</div>
            </div>
          `;
        }).join("");

        if (dayData.blocks.length === 0) {
          blocksHTML = `
            <p style="font-size:0.8rem; opacity:0.5; text-align:center; margin-top:20px;">
              Día libre
            </p>
          `;
        }

        card.innerHTML = `
          <div class="day-title">${displayNames[dayKey]}</div>
          ${blocksHTML}
          ${
            dayData.note
              ? `<div class="block note">
                   <div class="block-title">📌 Nota</div>
                   <div class="block-time">${dayData.note}</div>
                 </div>`
              : ""
          }
        `;

        grid.appendChild(card);
      });

      const notes = document.getElementById("generalNotes");

      if (data.generalNotes.length > 0) {
        notes.innerHTML = data.generalNotes.map(note => `<li>${note}</li>`).join("");
      } else {
        notes.innerHTML = "<li>Sin notas esta semana 🌿</li>";
      }
    }

    loadAll();
  </script>

 let cfg=window.PANELES_CONFIG||defaults;
 function parts(now){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now).filter(x=>x.type!=='literal').map(x=>[x.type,+x.value]));return p;}
 function carnival(y){ // Gregorian movable-calendar calculation; used only for the cultural carnival.
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31),day=(h+l-7*m+114)%31+1;
  return Date.UTC(y,month-1,day)-47*86400000;

 function md(s){const m=/^(\d{2})-(\d{2})$/.exec(s||'');return m?+m[1]*100+(+m[2]):0;}
 function inRange(n,start,end){return start<=end?n>=start&&n<=end:n>=start||n<=end;}
 function choose(now){
  const p=parts(now),day=p.month*100+p.day,utc=Date.UTC(p.year,p.month-1,p.day),tuesday=carnival(p.year);
  const seasons=[...cfg.estaciones].sort((a,b)=>md(a.inicio)-md(b.inicio));
  let season=seasons[seasons.length-1];for(const s of seasons){if(day>=md(s.inicio))season=s;}
  const event=cfg.eventos.find(e=>e.activo&&(e.regla==='entroido'?utc>=tuesday+Number(e.desdeOffset)*86400000&&utc<=tuesday+Number(e.hastaOffset)*86400000:inRange(day,md(e.desde),md(e.hasta))));

 let last='';
 function apply(now=new Date()){
  const state=choose(now);const signature=JSON.stringify([state.style,cfg.ancho,state.season]);if(last===signature)return state;last=signature;

  root.style.setProperty('--motif-size',image?'cover':'318px 72px');

 }
 window.PanelCalendar=Object.freeze({choose,apply,carnival});

  if(window.parent===window||ev.source!==window.parent||ev.data?.tipo!=='paneles-preview')return;
