<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horario semanal · Alba</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<!-- Si este archivo no existe, se usan los temas incluidos abajo. -->
<script src="./paneles_estaciones_config.js"></script>

<style>
:root {
  --ink: #704b3b;
  --muted: #896953;
  --accent: #b18560;
  --border: #d8bda2;
  --paper: #fcf6ef;
  --wash: #f6e9da;
  --motif: none;
  --motif-size: 440px 180px;
  --motif-opacity: .34;
  --pink: #d7a6b7;
  --pink-light: #f5e4eb;
  --sage: #a6b995;
  --sand: #d8bd86;
  --lavender: #b5a5ca;
}

* { box-sizing: border-box; }

html { min-height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  position: relative;
  isolation: isolate;
  font-family: "Nunito", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 15% 0%, #ffffffb8, transparent 55%),
    linear-gradient(135deg, var(--paper), var(--wash));
}

/* Fondo estacional estático, visible pero suave. */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image: var(--motif);
  background-size: var(--motif-size);
  background-position: 12px 18px;
  background-repeat: repeat;
  opacity: calc(var(--motif-opacity) * .7);
}

/* CABECERA MÁS COMPACTA */
.wrapper {
  padding-top: 22px;
}

.header {
  margin-bottom: 22px;
}

.header h1 {
  font-size: clamp(2.2rem, 4vw, 3rem);
}

.subtitle {
  margin: 2px 0 8px;
  font-size: .9rem;
}

.season-label {
  min-height: 30px;
  padding: 3px 13px;
  font-size: 17px;
}

.season-icon {
  width: 21px;
  height: 21px;
}

.calendar-card {
  width: 220px;
  margin-top: 14px;
}

.calendar-top {
  padding: 7px;
  font-size: .9rem;
}

.calendar-days {
  padding: 7px 8px 0;
  font-size: 2.2rem;
}

.calendar-text {
  padding-bottom: 9px;
  font-size: .8rem;
}

/* LA DECORACIÓN ACOMPAÑA */
body::before {
  opacity: calc(var(--motif-opacity) * .4);
}

.day-card::before {
  opacity: calc(var(--motif-opacity) * .25);
}

/* EL HORARIO GANA ESPACIO Y CONTRASTE */
.agenda {
  padding: 27px;
}

.day-card {
  padding: 32px 10px 16px;
  background: #fffdfa;
}

.day-title {
  margin-bottom: 14px;
  font-size: 1.55rem;
}

.block {
  margin: 7px 0;
  padding: 13px 10px;
  border-left-width: 5px;
  border-radius: 11px;
  box-shadow: 0 2px 5px #493c3010;
}

/* ESTUDIO: VERDE SALVIA */
.block.estudio {
  background: #e4efdd;
  border-left-color: #72965d;
}

.block.estudio .block-title {
  color: #446035;
}

.block.estudio .block-time {
  color: #2f4725;
}

/* DESCANSO: ROSA EMPOLVADO */
.block.descanso {
  background: #f5e1e9;
  border-left-color: #be7f97;
}

.block.descanso .block-title {
  color: #86516a;
}

.block.descanso .block-time {
  color: #673b50;
}

/* OTROS BLOQUES */
.block.variable {
  background: #f5edda;
  border-left-color: #bea166;
}

.block.variable .block-time {
  color: #69542e;
}

/* LAS HORAS SON EL ELEMENTO PRINCIPAL */
.block-title {
  font-family: "Nunito", sans-serif;
  font-size: .8rem;
  font-weight: 800;
  line-height: 1.3;
}

.block-time {
  margin-top: 7px;
  font-family: "Nunito", sans-serif;
  font-size: 1.2rem;
  font-weight: 900;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
  color: #453c34;
}

/* HOY SIGUE DESTACANDO */
.day-card.today {
  background: #fff5f8;
  outline-color: #cf95ab;
}

/* LAS NOTAS QUEDAN EN SEGUNDO PLANO */
.block.note {
  background: #faf5e9;
  border-left-color: #d7c6a3;
  box-shadow: none;
}

.block.note .block-time {
  font-size: .88rem;
  font-weight: 600;
  color: var(--muted);
}

.post-it-container {
  margin-top: 25px;
}

.week-notes {
  max-width: 480px;
  padding: 16px 22px;
  box-shadow: none;
}

.week-notes h2 {
  margin-bottom: 7px;
  font-size: 1.35rem;
}

.week-notes ul {
  font-family: "Nunito", sans-serif;
  font-size: .9rem;
}

.footer {
  margin-top: 18px;
}

.footer p {
  font-size: .9rem;
}

@media (max-width: 700px) {
  .agenda {
    padding: 22px 15px;
  }
}
</style>
</head>

<body>
<main class="wrapper">
  <header class="header">
    <h1>Horario semanal</h1>
    <p class="subtitle">Estudio, descansos y ratitos en compañía</p>

    <div class="season-label">
      <span id="seasonIcon" class="season-icon" aria-hidden="true"></span>
      <span id="seasonName"></span>
    </div>
    <p id="eventName" class="event-label" hidden></p>

    <div class="calendar-card">
      <div id="weekMonth" class="calendar-top">ESTA SEMANA</div>
      <div id="weekDays" class="calendar-days">—</div>
      <div id="weekText" class="calendar-text">Cargando horario…</div>
    </div>
  </header>

  <section class="agenda" aria-label="Horario de la semana">
    <div id="weekGrid" class="week-grid"></div>

    <div class="post-it-container">
      <section class="week-notes">
        <h2>Notas de la semana</h2>
        <ul id="generalNotes"></ul>
      </section>
    </div>

    <footer class="footer">
      <p>Hecho con mimo, para compartir el camino</p>
      <small id="lastUpdate"></small>
    </footer>
  </section>
</main>

<script>
(() => {
  "use strict";

  const ROOT = document.documentElement;
  const ZONE = "Europe/Madrid";

  const MOTIFS = {
    leaf:
      '<path d="M12 25l-1-6-7-1 4-5-4-5 7 1 2-7 3 6 6-3-1 7 6 3-7 4 1 6-6-1z" fill="currentColor"/>' +
      '<path d="M11 30l5-17m-2 9-5-6m7 3 5-4" fill="none" stroke="#fff5e5" stroke-width=".9"/>',

    spring:
      '<path d="M14 29q-3-13 8-22M16 22Q2 22 7 12q11 0 9 10M19 15q-1-10 9-10 2 9-9 10" fill="currentColor"/>' +
      '<circle cx="7" cy="6" r="3" fill="#d9b6c5"/>',

    summer:
      '<path d="M2 19q5-6 10 0t10 0t10 0M2 26q5-6 10 0t10 0t10 0" fill="none" stroke="currentColor" stroke-width="2"/>' +
      '<circle cx="11" cy="7" r="5" fill="#e2c88d"/>',

    winter:
      '<path d="M16 2v28M4 9l24 14M4 23L28 9M11 5l5 5 5-5M11 27l5-5 5 5M4 14l7-2-2-7M28 18l-7 2 2 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>',

    mask:
      '<path d="M2 10q5-7 14-1 9-6 14 1l-3 12q-6 4-11-1-5 5-11 1z" fill="currentColor"/>' +
      '<path d="M6 13q5-3 8 2-5 3-8-2m12 2q3-5 8-2-3 5-8 2" fill="#fff9ef"/>',

    book:
      '<path d="M3 5q7-2 13 2 6-4 13-2v22q-7-2-13 2-6-4-13-2z" fill="currentColor"/>' +
      '<path d="M16 7v22M7 10l5 1m-5 5 5 1m8-6 5-1m-5 7 5-1" fill="none" stroke="#fffaf0" stroke-width="1.2"/>',

    pumpkin:
      '<path d="M16 9q-3-6 3-7" fill="none" stroke="#839369" stroke-width="3"/>' +
      '<ellipse cx="16" cy="20" rx="14" ry="11" fill="currentColor"/>' +
      '<path d="M16 10q-8 10 0 20m0-20q8 10 0 20" fill="none" stroke="#fff2de" stroke-width="1"/>',

    chestnut:
      '<path d="M16 3Q-1 15 4 25q11 10 24-1Q32 13 16 3" fill="currentColor"/>' +
      '<path d="M4 24q12-5 24 0-11 11-24 0" fill="#d8bb8a"/>',

    sparkle:
      '<path d="M16 2l3 10 10 4-10 3-3 11-4-11-10-3 10-4z" fill="currentColor"/>' +
      '<circle cx="28" cy="4" r="2" fill="#c2b4d9"/>'
  };

  function palette(ink, muted, accent, border, paper, wash, motif) {
    return {
      texto: ink,
      textoSecundario: muted,
      acento: accent,
      borde: border,
      fondoClaro: paper,
      fondoPastel: wash,
      motivo: motif,
      imagenFondo: "",
      opacidadFondo: .34
    };
  }

  const spring = palette(
    "#506b52", "#74856e", "#91ab85", "#c0d3b8",
    "#fcfdf6", "#edf5e7", "spring"
  );
  const summer = palette(
    "#4d7078", "#6e8d91", "#91bcc3", "#c0dce0",
    "#fbfdfa", "#edf6f6", "summer"
  );
  const autumn = palette(
    "#704b3b", "#896953", "#b18560", "#d8bda2",
    "#fcf6ef", "#f6e9da", "leaf"
  );
  const winter = palette(
    "#5f667d", "#7f879d", "#a6afcc", "#d0d5e6",
    "#fbfbff", "#eef0f8", "winter"
  );

  const defaults = {
    version: 1,
    estaciones: [
      { ...spring, id: "primavera", nombre: "Primavera", inicio: "03-20" },
      { ...summer, id: "verano", nombre: "Verano", inicio: "06-21" },
      { ...autumn, id: "otono", nombre: "Otoño", inicio: "09-23" },
      { ...winter, id: "invierno", nombre: "Invierno", inicio: "12-21" }
    ],
    eventos: [
      {
        ...palette("#766078", "#93809a", "#bca1bd", "#dac9de",
          "#fffbfc", "#f4eaf4", "mask"),
        id: "entroido", nombre: "Entroido", activo: true,
        regla: "entroido", desdeOffset: -3, hastaOffset: 0
      },
      {
        ...palette("#617059", "#849079", "#a3b18b", "#d1d9bd",
          "#fffdf4", "#f1f4e6", "book"),
        id: "libro", nombre: "Día del Libro", activo: true,
        regla: "fecha", desde: "04-23", hasta: "04-23"
      },
      {
        ...palette("#54706a", "#7c9185", "#a1b7a3", "#cbdacd",
          "#fffdf7", "#edf4e9", "book"),
        id: "letras", nombre: "Letras Galegas", activo: true,
        regla: "fecha", desde: "05-17", hasta: "05-17"
      },
      {
        ...palette("#785743", "#95816f", "#c49a78", "#dac4b2",
          "#fff8ee", "#f3e9e0", "pumpkin"),
        id: "samain", nombre: "Samaín", activo: true,
        regla: "fecha", desde: "10-31", hasta: "10-31"
      },
      {
        ...palette("#735342", "#927863", "#b4956d", "#d6c3a6",
          "#fff9ee", "#f3eada", "chestnut"),
        id: "magosto", nombre: "Magosto", activo: true,
        regla: "fecha", desde: "11-11", hasta: "11-11"
      },
      {
        ...palette("#76664e", "#928575", "#bfa776", "#d9cdb5",
          "#fffdf4", "#f5f0e3", "sparkle"),
        id: "aninovo", nombre: "Fin de año / Aninovo", activo: true,
        regla: "fecha", desde: "12-31", hasta: "01-01"
      }
    ]
  };

  const external = window.PANELES_CONFIG;
  const cfg = external &&
    Array.isArray(external.estaciones) &&
    external.estaciones.length &&
    Array.isArray(external.eventos)
      ? external
      : defaults;

  function madridParts(now = new Date()) {
    return Object.fromEntries(
      new Intl.DateTimeFormat("en-GB", {
        timeZone: ZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(now)
        .filter(p => p.type !== "literal")
        .map(p => [p.type, Number(p.value)])
    );
  }

  function monthDay(value) {
    const match = /^(\d{2})-(\d{2})$/.exec(value || "");
    return match ? Number(match[1]) * 100 + Number(match[2]) : 0;
  }

  function inRange(day, from, to) {
    return from <= to
      ? day >= from && day <= to
      : day >= from || day <= to;
  }

  function carnival(year) {
    const a = year % 19;
    const b = Math.floor(year / 100);
    const c = year % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31);
    const day = (h + l - 7 * m + 114) % 31 + 1;
    return Date.UTC(year, month - 1, day) - 47 * 86400000;
  }

  function choose(now = new Date()) {
    const p = madridParts(now);
    const day = p.month * 100 + p.day;
    const utc = Date.UTC(p.year, p.month - 1, p.day);
    const tuesday = carnival(p.year);

    const seasons = [...cfg.estaciones]
      .sort((a, b) => monthDay(a.inicio) - monthDay(b.inicio));

    let season = seasons[seasons.length - 1];

    for (const item of seasons) {
      if (day >= monthDay(item.inicio)) season = item;
    }

    const event = cfg.eventos.find(item => {
      if (!item.activo) return false;

      if (item.regla === "entroido") {
        return utc >= tuesday + Number(item.desdeOffset) * 86400000 &&
               utc <= tuesday + Number(item.hastaOffset) * 86400000;
      }

      return inRange(day, monthDay(item.desde), monthDay(item.hasta));
    });

    return {
      season: season.id,
      event: event ? event.id : "",
      theme: (event || season).id,
      style: event || season,
      seasonStyle: season
    };
  }

  function svg(content, viewBox = "0 0 32 32") {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' +
      viewBox + '">' + content + "</svg>";
  }

  function background(kind, color) {
    const motif = (MOTIFS[kind] || MOTIFS.leaf)
      .replaceAll("currentColor", color);

    const positions = [
      [15, 20, 1.2, -25],
      [130, 98, .85, 32],
      [260, 8, 1.1, 20],
      [365, 110, 1.3, -30],
      [45, 135, .65, 55],
      [220, 140, .7, -15]
    ];

    return svg(positions.map(([x, y, scale, rotate]) =>
      '<g transform="translate(' + x + " " + y + ") scale(" +
      scale + ") rotate(" + rotate + ' 16 16)">' + motif + "</g>"
    ).join(""), "0 0 440 180");
  }

  let lastTheme = "";

  function apply(now = new Date()) {
    const state = choose(now);
    const signature = JSON.stringify([state.style, state.seasonStyle]);

    if (signature === lastTheme) return state;
    lastTheme = signature;

    const t = { ...autumn, ...state.style };
    const variables = {
      ink: t.texto,
      muted: t.textoSecundario,
      accent: t.acento,
      border: t.borde,
      paper: t.fondoClaro,
      wash: t.fondoPastel
    };

    for (const [name, value] of Object.entries(variables)) {
      ROOT.style.setProperty("--" + name, value);
    }

    let image = "";

    if (t.imagenFondo) {
      try {
        const resolved = new URL(
          t.imagenFondo,
          window.PANELES_CONFIG_BASE || document.baseURI
        );
        if (["http:", "https:", "file:", "data:", "blob:"]
            .includes(resolved.protocol)) {
          image = resolved.href;
        }
      } catch (_) {}
    }

    let motif = "none";

    if (image) {
      motif = "url(" + JSON.stringify(image) + ")";
    } else if (t.motivo !== "none") {
      const color = /^#[0-9a-f]{6}$/i.test(t.acento)
        ? t.acento : "#b18560";

      motif = 'url("data:image/svg+xml,' +
        encodeURIComponent(background(t.motivo, color)) + '")';
    }

    const opacity = Number(t.opacidadFondo);

    ROOT.style.setProperty("--motif", motif);
    ROOT.style.setProperty("--motif-size", image ? "cover" : "440px 180px");
    ROOT.style.setProperty(
      "--motif-opacity",
      Number.isFinite(opacity) ? Math.max(0, Math.min(1, opacity)) : .34
    );

    ROOT.dataset.season = state.season;
    ROOT.dataset.event = state.event;

    document.getElementById("seasonName").textContent =
      state.seasonStyle.nombre;

    const defaultIcon = {
      primavera: "spring",
      verano: "summer",
      otono: "leaf",
      invierno: "winter"
    };

    const icon = state.seasonStyle.motivo;
    document.getElementById("seasonIcon").innerHTML = svg(
      MOTIFS[icon] || MOTIFS[defaultIcon[state.season]] || MOTIFS.leaf
    );

    const eventLabel = document.getElementById("eventName");
    eventLabel.hidden = !state.event;
    eventLabel.textContent = state.event ? state.style.nombre : "";

    return state;
  }

  window.PanelCalendar = Object.freeze({ choose, apply, carnival });
  window.HorarioMadridParts = madridParts;

  apply();
  setInterval(() => apply(), 30000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) apply();
  });
})();
</script>

<script>
(() => {
  "use strict";

  const CONFIG_FILE = "./config_horario.txt";
  const GITHUB_USER = "bibiopotoleando";
  const GITHUB_REPO = "horario";

  const DAYS = [
    ["LUNES", "Lunes"],
    ["MARTES", "Martes"],
    ["MIERCOLES", "Miércoles"],
    ["JUEVES", "Jueves"],
    ["VIERNES", "Viernes"],
    ["SABADO", "Sábado"],
    ["DOMINGO", "Domingo"]
  ];

  const ICONS = {
    estudio: "📚",
    descanso: "☕",
    variable: "✨",
    nocturno: "🌙"
  };

  function normalizeKey(text) {
    return text.toUpperCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
  }

  function parseData(text) {
    const schedule = {};
    const generalNotes = [];

    let currentDay = null;
    let week = "";
    let isNotes = false;

    text.replace(/\uFEFF/g, "").split(/\r?\n/).forEach(rawLine => {
      const line = rawLine.trim();
      if (!line || line.startsWith("#")) return;

      if (line.toUpperCase().includes("[NOTAS]")) {
        isNotes = true;
        currentDay = null;
        return;
      }

      if (isNotes) {
        const note = line.replace(/^-\s*/, "").trim();
        if (note) generalNotes.push(note);
        return;
      }

      if (/^SEMANA:/i.test(line)) {
        week = line.replace(/^SEMANA:/i, "").trim();
        return;
      }

      const match = line.match(
        /\[(LUNES|MARTES|MIERCOLES|MIÉRCOLES|JUEVES|VIERNES|SABADO|SÁBADO|DOMINGO)\]/i
      );

      if (match) {
        currentDay = normalizeKey(match[1]);
        schedule[currentDay] = { blocks: [], note: "" };
        return;
      }

      if (!currentDay || !line.includes(":")) return;

      const colon = line.indexOf(":");
      const key = line.slice(0, colon).trim().toLowerCase();
      const value = line.slice(colon + 1).trim();

      if (key === "nota") {
        schedule[currentDay].note = value;
        return;
      }

      let time = value;
      let type = "variable";

      if (value.includes("|")) {
        const parts = value.split("|");
        time = parts[0].trim();
        const typeText = (parts[1] || "").trim().toLowerCase();

        if (typeText.includes("estudio")) type = "estudio";
        else if (typeText.includes("descanso")) type = "descanso";
      } else if (value.toLowerCase().includes("descanso")) {
        type = "descanso";
        time = "Descanso";
      }

      let label;

      if (key === "nocturno") {
        label = type === "estudio"
          ? "Estudio nocturno"
          : type === "descanso" ? "Descanso nocturno" : "Nocturno";
      } else if (type === "estudio") {
        label = "Estudio de " + key;
      } else if (type === "descanso") {
        label = "Descanso";
      } else {
        label = key.charAt(0).toUpperCase() + key.slice(1);
      }

      schedule[currentDay].blocks.push({
        time, type, label, period: key
      });
    });

    return { week, schedule, generalNotes };
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function updateToday() {
    const today = normalizeKey(
      new Intl.DateTimeFormat("es-ES", {
        timeZone: "Europe/Madrid",
        weekday: "long"
      }).format(new Date())
    );

    document.querySelectorAll(".day-card").forEach(card => {
      const current = card.dataset.day === today;
      card.classList.toggle("today", current);
      if (current) card.setAttribute("aria-current", "date");
      else card.removeAttribute("aria-current");
    });
  }

  function renderWeekHeader(week) {
    document.getElementById("weekText").textContent =
      week ? "Semana del " + week : "Semana actual";

    const match = week.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (!match) {
      document.getElementById("weekDays").textContent = "Lun → Dom";
      return;
    }

    const start = new Date(Date.UTC(
      Number(match[3]), Number(match[2]) - 1, Number(match[1]), 12
    ));
    const end = new Date(start.getTime() + 6 * 86400000);

    const month = date => new Intl.DateTimeFormat("es-ES", {
      timeZone: "UTC", month: "long"
    }).format(date).toUpperCase();

    const startMonth = month(start);
    const endMonth = month(end);

    document.getElementById("weekMonth").textContent =
      start.getUTCFullYear() !== end.getUTCFullYear()
        ? startMonth + " " + start.getUTCFullYear() +
          " / " + endMonth + " " + end.getUTCFullYear()
        : startMonth === endMonth
          ? startMonth + " " + start.getUTCFullYear()
          : startMonth + " / " + endMonth + " " + end.getUTCFullYear();

    document.getElementById("weekDays").textContent =
      String(start.getUTCDate()).padStart(2, "0") + " → " +
      String(end.getUTCDate()).padStart(2, "0");
  }

  function renderUI(data) {
    renderWeekHeader(data.week);

    const grid = document.getElementById("weekGrid");
    grid.replaceChildren();

    DAYS.forEach(([key, name]) => {
      const day = data.schedule[key] || { blocks: [], note: "" };
      const card = element("article", "day-card");
      card.dataset.day = key;
      card.append(element("h2", "day-title", name));

      day.blocks.forEach(block => {
        const classes = "block " + block.type +
          (block.period === "nocturno" ? " nocturno" : "");

        const box = element("div", classes);
        const icon = block.period === "nocturno"
          ? ICONS.nocturno
          : ICONS[block.type] || "✨";

        box.append(
          element("div", "block-title", icon + " " + block.label),
          element("div", "block-time", block.time)
        );

        card.append(box);
      });

      if (!day.blocks.length) {
        card.append(element("p", "free-day", "Día libre"));
      }

      if (day.note) {
        const note = element("div", "block note");
        note.append(
          element("div", "block-title", "📌 Nota"),
          element("div", "block-time", day.note)
        );
        card.append(note);
      }

      grid.append(card);
    });

    const notes = document.getElementById("generalNotes");
    notes.replaceChildren();

    const list = data.generalNotes.length
      ? data.generalNotes
      : ["Sin notas esta semana 🌿"];

    list.forEach(text => notes.append(element("li", "", text)));

    updateToday();
  }

  async function fetchGitHubDate() {
    const target = document.getElementById("lastUpdate");

    try {
      const url = "https://api.github.com/repos/" +
        GITHUB_USER + "/" + GITHUB_REPO +
        "/commits?path=config_horario.txt&per_page=1";

      const response = await fetch(url);
      if (!response.ok) throw new Error("Fecha no disponible");

      const commits = await response.json();
      const value = commits[0]?.commit?.committer?.date;
      if (!value) throw new Error("Sin fecha");

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) throw new Error("Fecha inválida");

      target.textContent = "Actualizado el " +
        new Intl.DateTimeFormat("es-ES", {
          timeZone: "Europe/Madrid",
          day: "numeric",
          month: "long",
          year: "numeric"
        }).format(date);
    } catch (_) {
      target.textContent = "";
    }
  }

  async function loadAll() {
    try {
      const response = await fetch(CONFIG_FILE + "?v=" + Date.now());
      if (!response.ok) throw new Error("No se pudo leer el horario");

      const data = parseData(await response.text());
      renderUI(data);
      fetchGitHubDate();
    } catch (error) {
      const grid = document.getElementById("weekGrid");
      grid.replaceChildren();

      const box = element("div", "error-box");
      box.append(
        element("strong", "", "No se pudo cargar el horario."),
        element("p", "",
          "Comprueba que config_horario.txt esté en la misma carpeta " +
          "que este HTML y abre la página desde GitHub Pages."
        )
      );

      grid.append(box);
      document.getElementById("weekText").textContent =
        "Horario pendiente de cargar";
    }
  }

  loadAll();
  setInterval(updateToday, 60000);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) updateToday();
  });
})();
</script>
</body>
</html>
